example.property= I AM default organ

# DataSource settings: set here your own configurations for the database
spring.datasource.url =	jdbc:mysql://localhost:3306/ms
spring.datasource.username = root
spring.datasource.password =

eureka.instance.preferIpAddress=true
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
#docker: http://eureka-server:8070/eureka/; localhost: http://localhost:8070/eureka/
eureka.client.serviceUrl.defaultZone=http://localhost:8070/eureka/

logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false
management.tracing.sampling.probability=1.0

action.operation.change.topic=orgChangeTopic

# security and oauth2
spring.security.oauth2.client.registration.keycloak.client-id=spring-app
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=password
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/auth-realm
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username