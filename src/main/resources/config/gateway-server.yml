spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: spring-app
          uri: lb://spring-app
          predicates:
            - Path=/licenseService/**
          filters:
            - RewritePath=/licenseService/(?<path>.*), /$\{path}
        - id: organization-server
          uri: lb://organization-server
          predicates:
            - Path=/organizationServer/**
          filters:
            - RewritePath=/organizationServer/(?<path>.*), /$\{path}
